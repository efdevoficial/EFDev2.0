
name: Versionamento Automatico

on:
  push:

permissions:
  contents: write

jobs:
  versionar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Atualizar versao
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s "$GITHUB_SHA")
          MSG="${MSG,,}"

          # Evita processar commits gerados pelo proprio bot
          if [[ "$MSG" == "chore(version):"* ]]; then
            echo "Commit de versionamento ignorado."
            exit 0
          fi

          # Apenas os prefixos definidos atualizam a versao
          if [[ ! "$MSG" =~ ^(feat|fix|master)(:|\(|[[:space:]]) ]]; then
            echo "Prefixo sem versionamento: $MSG"
            exit 0
          fi

          FILE="version.json"

          if [ ! -f "$FILE" ]; then
            echo '{"version":"2.0.0"}' > "$FILE"
          fi

          VERSION=$(node -p \
            "require('./$FILE').version")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Validar formato MAJOR.MINOR.PATCH
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versao invalida: $VERSION"
            exit 1
          fi

          case "$MSG" in
            feat:*|feat\(*|feat\ *)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            fix:*|fix\(*|fix\ *)
              PATCH=$((PATCH + 1))
              ;;
            master:*|master\(*|master\ *)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "{\"version\":\"$NEW_VERSION\"}" > "$FILE"

          git add "$FILE"
          git commit -m "chore(version): $NEW_VERSION"
          git push

          echo "Versao atualizada: $NEW_VERSION"
